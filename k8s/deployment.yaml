apiVersion: apps/v1
kind: Deployment
metadata:
  name: batching-inference-server
  labels:
    app: batching-inference-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: batching-inference-server
  template:
    metadata:
      labels:
        app: batching-inference-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /actuator/prometheus
    spec:
      containers:
        - name: server
          image: your-registry/dynamic-batching-inference-server:latest
          ports:
            - containerPort: 8080
          env:
            - name: INFERENCE_BATCH_MAX_BATCH_SIZE
              value: "8"
            - name: INFERENCE_BATCH_MAX_WAIT_MS
              value: "50"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
